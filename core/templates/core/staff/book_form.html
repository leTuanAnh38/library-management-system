{% extends 'core/base.html' %}

{% block title %}{{ title }} - Quản lý thư viện{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-success bg-opacity-10 p-3 rounded-circle text-success me-3">
                            <i class="fas fa-book fa-2x"></i>
                        </div>
                        <h2 class="fw-bold m-0 text-dark">{{ title }}</h2>
                    </div>

                    <form method="POST" class="row g-4">
                        {% csrf_token %}
                        
                        {% for field in form %}
                        <div class="{% if field.name == 'description' or field.name == 'cover_image' %}col-12{% else %}col-md-6{% endif %}">
                            <label class="form-label fw-bold small text-uppercase text-muted">
                                {{ field.label }}
                            </label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <div class="col-12 mt-5 pt-3 border-top">
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success rounded-pill px-5 fw-bold shadow-sm">
                                    <i class="fas fa-save me-2"></i>Lưu sách
                                </button>
                                <a href="{% url 'staff_dashboard' %}" class="btn btn-light rounded-pill px-4 border">
                                    Hủy bỏ
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
