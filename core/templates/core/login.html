{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng nhập - Thư viện Alovu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="{% static 'css/style.css' %}?v=1.2" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="container auth-container login-box">
        <div class="card auth-card p-4 p-md-5 border-0 shadow-lg position-relative overflow-hidden">
            <div class="position-absolute top-0 start-0 w-100 bg-primary" style="height: 6px;"></div>
            
            <div class="text-center brand-logo mb-4 mt-2">
                <img src="{% static 'img/logo.png' %}" alt="Alovu Logo" 
                     onerror="this.outerHTML='<i class=\'fas fa-book-reader text-primary\' style=\'font-size: 3.5rem;\'></i>'">
            </div>

            <div class="text-center mb-4">
                <h3 class="text-dark fw-bold mb-2">Chào mừng trở lại! 👋</h3>
                <p class="text-muted">Vui lòng đăng nhập để mượn sách tại Alovu</p>
            </div>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show rounded-3 small fw-medium shadow-sm">
                        <i class="fas fa-info-circle me-2"></i>{{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark small text-uppercase letter-spacing-1">Tên đăng nhập</label>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-primary"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Nhập tên đăng nhập" required>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-bold text-dark small text-uppercase letter-spacing-1 m-0">Mật khẩu</label>
                        <a href="#" class="small text-primary text-decoration-none fw-medium">Quên mật khẩu?</a>
                    </div>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-white border-end-0 text-primary"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-auth w-100 shadow mt-2">
                    Đăng nhập <i class="fas fa-sign-in-alt ms-2"></i>
                </button>
            </form>
            
            <div class="text-center mt-4 pt-3 border-top">
                <p class="mb-2 text-muted">Chưa có tài khoản? <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none transition-hover">Đăng ký ngay</a></p>
                <a href="{% url 'home' %}" class="text-secondary text-decoration-none small fw-medium transition-hover d-inline-block mt-2">
                    <i class="fas fa-arrow-left me-1"></i> Trở về Trang chủ
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="{% static 'js/auth_system.js' %}"></script>

</body>
</html>
