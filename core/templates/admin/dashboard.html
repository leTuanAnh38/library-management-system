{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dashboard</title>
    <style>
        body { background-color: #f3f6f9; padding: 20px; font-family: sans-serif; }
        .custom-chart-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1);
            padding: 20px;
            border-top: 4px solid #ff8c00;
        }
        .custom-chart-title { color: #ff8c00; font-size: 18px; margin-top: 0; }
    </style>
</head>
<body>
    <div class="custom-chart-card">
        <h3 class="custom-chart-title">📊 Thống kê lượt mượn sách 2026</h3>
        <div style="height: 300px; width: 100%;">
            <canvas id="borrowChart"></canvas>
        </div>
    </div>

    {{ borrow_stats|json_script:"borrow-data" }}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var ctx = document.getElementById('borrowChart').getContext('2d');
            const borrowStats = JSON.parse(document.getElementById('borrow-data').textContent);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'],
                    datasets: [{
                        label: 'Số lượt mượn',
                        data: borrowStats,
                        backgroundColor: 'rgba(255, 140, 0, 0.7)', 
                        borderRadius: 5
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        });
    </script>
</body>
</html>
