{% extends "jazzmin/index.html" %}
{% load static %}

{% block content %}
    <div class="row mb-4">
        <div class="col-12">
            <div class="card card-primary card-outline shadow-sm">
                <div class="card-header">
                    <h3 class="card-title text-orange fw-bold">
                        <i class="fas fa-chart-bar mr-2"></i>Thống kê lượt mượn sách 2026
                    </h3>
                </div>
                <div class="card-body">
                    <div style="height: 300px;">
                        <canvas id="borrowChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    {{ block.super }}

    {{ borrow_stats|json_script:"borrow-data" }}

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var ctx = document.getElementById('borrowChart').getContext('2d');
            
            // 3. Đọc dữ liệu từ thẻ JSON đã tạo ở trên
            const borrowStats = JSON.parse(document.getElementById('borrow-data').textContent);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 
                             'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'],
                    datasets: [{
                        label: 'Số lượt mượn',
                        data: borrowStats,
                        backgroundColor: 'rgba(255, 140, 0, 0.7)', 
                        borderColor: 'rgba(255, 140, 0, 1)',
                        borderWidth: 2,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            ticks: { stepSize: 1 } 
                        }
                    }
                }
            });
        });
    </script>
{% endblock %}
